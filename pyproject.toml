[project]
name = "spg-023mk"
version = "0.1.0"
description = "ПО управления испытательным стендом амортизаторов SPG-023MK"
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
    "crcmod>=1.7",
    "numpy>=2.4.6",
    "pillow>=12.3.0",
    "pydantic>=2.13.5",
    "pymodbus==3.12.0",
    "pyqtgraph>=0.14.0",
    "pyserial>=3.5",
    "pyside6>=6.11.2",
    "python-dotenv>=1.2.4",
    "scipy>=1.17.1",
    "tendo>=0.3.0",
]

[dependency-groups]
dev = [
    "pyinstaller>=6.22.3",
]
